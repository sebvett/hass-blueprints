blueprint:
  name: Dual Button Switch Actions
  description: >
    Assign actions to all press combinations of a dual-button (left/right/both)
    switch. Select a Home Assistant event entity, such as a Zigbee2MQTT
    event.*_action entity. A press sets event_type to single_left, double_left,
    or hold_left, and the same single, double, and hold forms for right and both.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    action_event:
      name: Action event
      description: Event entity that reports button presses
      selector:
        entity:
          domain: event

    left_section:
      name: Left Button
      icon: mdi:arrow-left-bold
      collapsed: true
      input:
        left_action:
          name: Left (single)
          description: Action for a single press of the left button
          default: []
          selector:
            action: {}
        left_double_action:
          name: Left (double)
          description: Action for a double press of the left button
          default: []
          selector:
            action: {}
        left_long_action:
          name: Left (long)
          description: Action for a long press of the left button
          default: []
          selector:
            action: {}

    right_section:
      name: Right Button
      icon: mdi:arrow-right-bold
      collapsed: true
      input:
        right_action:
          name: Right (single)
          description: Action for a single press of the right button
          default: []
          selector:
            action: {}
        right_double_action:
          name: Right (double)
          description: Action for a double press of the right button
          default: []
          selector:
            action: {}
        right_long_action:
          name: Right (long)
          description: Action for a long press of the right button
          default: []
          selector:
            action: {}

    both_section:
      name: Both Buttons
      icon: mdi:arrow-left-right-bold
      collapsed: true
      input:
        both_action:
          name: Both (single)
          description: Action when both buttons are pressed once
          default: []
          selector:
            action: {}
        both_double_action:
          name: Both (double)
          description: Action when both buttons are double-pressed
          default: []
          selector:
            action: {}
        both_long_action:
          name: Both (long)
          description: Action when both buttons are long-pressed
          default: []
          selector:
            action: {}

triggers:
  - trigger: state
    entity_id: !input action_event
    not_from:
      - unavailable

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'single_left' }}"
        sequence: !input left_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'double_left' }}"
        sequence: !input left_double_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'hold_left' }}"
        sequence: !input left_long_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'single_right' }}"
        sequence: !input right_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'double_right' }}"
        sequence: !input right_double_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'hold_right' }}"
        sequence: !input right_long_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'single_both' }}"
        sequence: !input both_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'double_both' }}"
        sequence: !input both_double_action
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type | default('') == 'hold_both' }}"
        sequence: !input both_long_action

mode: parallel
max: 10
